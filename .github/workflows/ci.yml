name: Extension CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static validation
        run: npm run validate:static

      - name: TypeScript
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Release asset validation
        run: npm run validate:release
